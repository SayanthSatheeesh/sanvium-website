name: Link check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  links:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webpage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check internal links
        run: npx --yes linkinator@8 . --config ../.github/linkinator.config.json
