<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ready to build something remarkable? Tell us about your project. Sanvium Technologies responds to all inquiries within 24 hours.">
  <title>Start a Project | Sanvium Technologies</title>
  <link rel="canonical" href="https://sanviumtechnologies.com/connect/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#080808">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components/nav-dock.css">
  <link rel="stylesheet" href="/assets/css/components/nav-overlay.css">
  <link rel="stylesheet" href="/assets/css/components/cursor-spotlight.css">
  <link rel="stylesheet" href="/assets/css/components/split-text.css">
  <link rel="stylesheet" href="/assets/css/components/loco-scroll.css">
  <link rel="stylesheet" href="/assets/css/components/footer.css">
  <link rel="stylesheet" href="/assets/css/pages/connect.css">

  <!-- GSAP & Locomotive Scroll CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.js" defer></script>
</head>
<body class="page-connect">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <nav class="nav-dock" role="navigation" aria-label="Primary navigation">
    <button class="nav-dock__menu" id="menu-toggle" aria-expanded="false" aria-controls="nav-overlay" aria-label="Open navigation menu">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Menu</span>
    </button>
    <a class="nav-dock__logo" href="/" aria-label="Sanvium Technologies - Home">
      <span class="logo-text">Sanvium.</span>
    </a>
    <a class="nav-dock__cta" href="/connect/">Contact Us</a>
  </nav>

  <div class="nav-overlay" id="nav-overlay" role="dialog" aria-modal="true" aria-label="Site navigation" hidden>
    <div class="nav-overlay__grid">
      <a class="nav-overlay__item" href="/">HOME</a>
      <a class="nav-overlay__item" href="/studio/">STUDIO</a>
      <a class="nav-overlay__item" href="/portfolio/">PORTFOLIO</a>
      <a class="nav-overlay__item" href="/wedding/">WEDDING</a>
      <a class="nav-overlay__item" href="/journal/">JOURNAL</a>
      <a class="nav-overlay__item" href="/connect/">CONNECT</a>
    </div>
  </div>

  <!-- Scroll Container for Locomotive Inertia -->
  <div data-scroll-container id="scroll-container">
    <main id="main-content">
      <section class="section hero" data-scroll-section>
          <div class="container" data-scroll data-scroll-speed="0.3">
              <h1 class="hero__headline" data-split>THE CONNECTION</h1>
              <p class="hero__subtitle" data-animate data-delay="1">Let's build something remarkable together.</p>
          </div>
      </section>

      <section class="section form-section" data-scroll-section>
          <div class="container">
              <form class="contact-form" id="contact-form" novalidate data-animate>
                  <div class="form-group">
                      <label class="form-label" for="full-name">Full Name <span aria-label="required">*</span></label>
                      <input class="form-input" type="text" id="full-name" name="full_name" required autocomplete="name" aria-describedby="full-name-error">
                      <span class="form-error" id="full-name-error" role="alert" aria-live="polite" hidden></span>
                  </div>
                  <div class="form-group">
                      <label class="form-label" for="email">Email <span aria-label="required">*</span></label>
                      <input class="form-input" type="email" id="email" name="email" required autocomplete="email" aria-describedby="email-error">
                      <span class="form-error" id="email-error" role="alert" aria-live="polite" hidden></span>
                  </div>
                  <div class="form-group">
                      <label class="form-label" for="company">Company</label>
                      <input class="form-input" type="text" id="company" name="company" autocomplete="organization">
                  </div>
                  <div class="form-group">
                      <label class="form-label" for="project-type">Project Type <span aria-label="required">*</span></label>
                      <select class="form-select" id="project-type" name="project_type" required aria-describedby="project-type-error">
                          <option value="">Select a project type</option>
                          <option value="web-development">Web Development</option>
                          <option value="brand-identity">Brand Identity</option>
                          <option value="ux-ui">UX/UI Design</option>
                          <option value="motion">Motion Graphics</option>
                          <option value="architectural">Architectural</option>
                          <option value="wedding">Wedding invitations &amp; guest desk</option>
                          <option value="other">Other</option>
                      </select>
                      <span class="form-error" id="project-type-error" role="alert" aria-live="polite" hidden></span>
                  </div>
                   <div class="form-group">
                      <label class="form-label" for="budget">Budget Range</label>
                      <select class="form-select" id="budget" name="budget_range">
                          <option value="">Select a budget range</option>
                          <option value="under-10k">Under $10k</option>
                          <option value="10k-25k">$10k - $25k</option>
                          <option value="25k-50k">$25k - $50k</option>
                          <option value="50k+">$50k+</option>
                      </select>
                  </div>
                  <div class="form-group">
                      <label class="form-label" for="message">Message <span aria-label="required">*</span></label>
                      <textarea class="form-textarea" id="message" name="message" rows="5" required aria-describedby="message-error"></textarea>
                      <span class="form-error" id="message-error" role="alert" aria-live="polite" hidden></span>
                  </div>
                  <div class="form-group form-group--checkbox">
                      <label class="form-checkbox">
                      <input type="checkbox" name="privacy" id="privacy" required aria-describedby="privacy-error">
                      <span>I agree to the <a href="/privacy-policy/">Privacy Policy</a></span>
                      </label>
                      <span class="form-error" id="privacy-error" role="alert" aria-live="polite" hidden></span>
                  </div>
                  <div id="form-global-error" class="form-error" role="alert" aria-live="polite" hidden></div>
                  <button type="submit" class="btn btn--primary btn--full" id="submit-btn">
                      <span class="btn__text">Submit Inquiry</span>
                      <span class="btn__loader" aria-hidden="true" hidden>...</span>
                  </button>
                  <div class="form-success" id="form-success" role="status" aria-live="polite" hidden>
                      <h3>Message received!</h3>
                      <p>We'll be in touch within 24 hours.</p>
                  </div>
              </form>
          </div>
      </section>
    </main>

    <footer class="footer" role="contentinfo">
       <div class="container">
        <div class="footer__inner">
          <p class="footer__copy">&copy; <span id="year"></span> Sanvium Technologies. All rights reserved.</p>
        </div>
      </div>
    </footer>
  </div><!-- /data-scroll-container -->

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="/assets/js/main.js" type="module" defer></script></body>
</html>
